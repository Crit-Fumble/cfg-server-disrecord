name: release

# Build the production Docker image and push to GitHub Container Registry.
#
# Triggered automatically on `v*` tag pushes (e.g. `git tag v0.1.2 && git push
# --tags`) and manually via the Actions UI for one-off rebuilds. The image is
# pushed to ghcr.io/crit-fumble/cfg-server-disrecord with three tags per build:
#   - the git ref (e.g. v0.1.2)
#   - latest (only on v* tags)
#   - sha-<short-sha> (always)
#
# Mirrors cfg-core-server's release.yml — same registry / token / BuildKit
# secret contract for installing private @crit-fumble/* packages.
#
# ⚠️ `:latest` IS WHAT PRODUCTION SPAWNS (owner decision 2026-08-05). core-server
# reads `disrecordWorkerImage` and pulls it before every spawn (`imagePull:
# 'always'`), so what this workflow publishes to `:latest` is what the next
# recording session runs. That makes this workflow a production gate, not just a
# build, which is why the `verify` job below exists: nothing reaches `:latest`
# without a version match, a main ancestry check, and a green CI run for the
# exact commit being released.
#
# See docs/releasing.md for the full contract.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.2). Checked out and built, and used as the image tag.'
        required: true

permissions:
  contents: read
  packages: write
  checks: read

jobs:
  # Gate the publish. Cheap — seconds, no install — because it ASKS whether CI
  # passed for this commit rather than re-running it. Re-running would both
  # cost ~12 minutes of native compiles and prove something weaker: a fresh
  # green run on a re-resolved dependency tree, not the run that gated `main`.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Same ref the build job checks out, so the CI gate below asks about the commit being built (dt#670).
          ref: ${{ inputs.tag || github.ref }}

      # A package.json behind the tags makes `npm version patch` propose a tag
      # that already exists.
      - name: Tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG="$GITHUB_REF_NAME"
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match package.json ($PKG). Bump the version in a PR into next, promote, then tag the promoted commit."
            exit 1
          fi
          echo "$TAG matches package.json"

      # `:latest` feeds production, so only promoted code may claim it.
      - name: Tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. :latest is what production spawns — release promoted commits only."
            exit 1
          fi
          echo "commit is on main"

      # A tag can be pushed to any commit, including one CI never saw. CI runs
      # on push to main/next and on PRs — never on tags — so without this a
      # release could publish an untested build straight to `:latest`.
      #
      # ⚠️ IT MUST WAIT, not just look. The promotion push to `main` and the tag
      # push land within seconds of each other, so this job routinely starts
      # BEFORE CI has registered a check-run for the commit. Reading the API once
      # and treating "not reported yet" as "untested" fails a release whose CI
      # is merely late. Same trap dev-tools' promote.sh documents: "queued" and
      # "expected" both mean wait, and neither says how long.
      #
      # `conclusion` is null while a run is queued or in progress, so absence
      # and in-flight are the same signal here: keep waiting. Only a RESOLVED
      # non-success is fatal.
      - name: CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Not $GITHUB_SHA: on a dispatch that is the branch head, not the tag being built (dt#670).
          SHA=$(git rev-parse HEAD)
          DEADLINE=$(( $(date +%s) + 900 ))
          while :; do
            RUNS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name == "test")]')

            if [ "$(echo "$RUNS" | jq 'any(.[]; .conclusion == "success")')" = "true" ]; then
              echo "CI test check is green for $SHA"
              exit 0
            fi

            # A resolved non-success with nothing green is a real failure —
            # fail now rather than burning the whole timeout.
            BAD=$(echo "$RUNS" | jq -r '[.[] | select(.conclusion != null and .conclusion != "success") | .conclusion] | join(", ")')
            if [ -n "$BAD" ]; then
              echo "::error::CI 'test' for $SHA concluded: $BAD. Nothing untested reaches :latest."
              exit 1
            fi

            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::timed out after 15m waiting for CI 'test' on $SHA. Was the commit ever pushed to main or next?"
              exit 1
            fi
            echo "waiting for CI 'test' on ${SHA:0:8} (queued or not yet reported)…"
            sleep 20
          done

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A dispatch runs on a branch; without this it builds the branch head, not the tag (dt#670).
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          # sha-<short> and the revision label come from the checked-out commit, not github.sha (a dispatch's branch head) — dt#670.
          context: git
          images: ghcr.io/crit-fumble/cfg-server-disrecord
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            npmrc=//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
