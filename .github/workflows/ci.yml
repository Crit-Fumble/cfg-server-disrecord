name: CI

on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    # Without a timeout a hang here runs to GitHub's 6h default, and because the
    # job never CONCLUDES it never reports failure — CI gates nothing.
    #
    # 25, not 10: `npm ci` alone takes ~11 minutes on this runner because
    # @discordjs/opus and @snazzah/davey compile from source. A 10-minute cap
    # would kill healthy runs during install, which is a worse failure than the
    # one it guards. The suite itself runs in about a second.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
